<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }
    .add-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    button {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { filter: brightness(1.1); }
    .habit {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .habit-info { flex: 1; }
    .habit-name { font-weight: 600; margin-bottom: 0.25rem; }
    .streak { font-size: 0.85rem; color: var(--muted); }
    .streak strong { color: var(--success); }
    .check-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .check-btn.done {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .delete-btn {
      background: transparent;
      color: var(--muted);
      padding: 0.4rem;
      font-size: 0.85rem;
    }
    .delete-btn:hover { color: #f87171; }
    .empty { text-align: center; color: var(--muted); padding: 2rem; }
    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      justify-content: center;
    }
    .stat {
      background: var(--card);
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      text-align: center;
    }
    .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 Habit Tracker</h1>
    <p class="subtitle">Build better habits. Data stays in your browser.</p>

    <div class="stats" id="stats"></div>

    <div class="add-form">
      <input type="text" id="habitInput" placeholder="New habit (e.g. Exercise, Read 20 min)..." maxlength="60">
      <button onclick="addHabit()">Add</button>
    </div>

    <div id="list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'habit-tracker-v1';

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save(habits) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function calcStreak(history) {
      if (!history || history.length === 0) return 0;
      const sorted = [...history].sort().reverse();
      let streak = 0;
      let current = new Date();
      for (const d of sorted) {
        const dateStr = current.toISOString().slice(0, 10);
        if (d === dateStr) {
          streak++;
          current.setDate(current.getDate() - 1);
        } else if (d < dateStr) {
          break;
        }
      }
      return streak;
    }

    function render() {
      const habits = load();
      const list = document.getElementById('list');
      const stats = document.getElementById('stats');

      const todayStr = today();
      const doneToday = habits.filter(h => (h.history || []).includes(todayStr)).length;

      stats.innerHTML = `
        <div class="stat"><div class="stat-num">${habits.length}</div><div class="stat-label">Habits</div></div>
        <div class="stat"><div class="stat-num">${doneToday}</div><div class="stat-label">Done today</div></div>
      `;

      if (habits.length === 0) {
        list.innerHTML = '<div class="empty">No habits yet. Add one above!</div>';
        return;
      }

      list.innerHTML = habits.map((h, i) => {
        const history = h.history || [];
        const isDone = history.includes(todayStr);
        const streak = calcStreak(history);
        return `
          <div class="habit">
            <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggle(${i})">
              ${isDone ? '✓' : ''}
            </button>
            <div class="habit-info">
              <div class="habit-name">${escapeHtml(h.name)}</div>
              <div class="streak">Streak: <strong>${streak} day${streak !== 1 ? 's' : ''}</strong></div>
            </div>
            <button class="delete-btn" onclick="removeHabit(${i})">✕</button>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addHabit() {
      const input = document.getElementById('habitInput');
      const name = input.value.trim();
      if (!name) return;
      const habits = load();
      habits.push({ name, history: [] });
      save(habits);
      input.value = '';
      render();
    }

    function toggle(index) {
      const habits = load();
      const h = habits[index];
      const todayStr = today();
      h.history = h.history || [];
      const idx = h.history.indexOf(todayStr);
      if (idx >= 0) {
        h.history.splice(idx, 1);
      } else {
        h.history.push(todayStr);
      }
      save(habits);
      render();
    }

    function removeHabit(index) {
      if (!confirm('Delete this habit?')) return;
      const habits = load();
      habits.splice(index, 1);
      save(habits);
      render();
    }

    document.getElementById('habitInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addHabit();
    });

    render();
  </script>
</body>
</html>
